name: Reusable API Call Workflow

env:
    OWNER: ${{ github.repository_owner }}
    REPO: ${{ github.event.repository.name }}

on:
    workflow_call:

permissions:
    contents: read
    actions: read

jobs:
    Checkrepository:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check Repository Out
              uses: actions/checkout@v4

            - name: Check Repository Calling
              run: |
                  echo "This workflow was called by the ${{ github.actor }} actor" >> $GITHUB_STEP_SUMMARY
                  echo "This workflow was called from the ${{ github.repository }} repository" >> $GITHUB_STEP_SUMMARY
                  echo "This workflow was called by the ${{ github.workflow }} workflow" >> $GITHUB_STEP_SUMMARY

            - name: Check Repository Structure
              run: |
                  echo "The repository structure is as follows:" >> $GITHUB_STEP_SUMMARY
                  tree -L 2 >> $GITHUB_STEP_SUMMARY || echo "Tree command not available, skipping repository structure output." >> $GITHUB_STEP_SUMMARY
                  echo "Repository structure output complete." >> $GITHUB_STEP_SUMMARY

    APICallCheckworkflow:
        needs: Checkrepository
        runs-on: ubuntu-latest
        steps:
            - name: Make API Call
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "Making API Call to check for workflows being used in repository..." >> $GITHUB_STEP_SUMMARY
                  response=$(gh api \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-Github-Api-Version: 2022-11-28" \
                    /repos/${{ env.OWNER }}/${{ env.REPO }}/actions/workflows)

                  echo "$response" | jq '{
                    owner: "${{ env.OWNER }}",
                    repo: "${{ env.REPO }}",
                    total_count: (.total_count // 0),
                    workflow_names: [.workflows[]?.name]
                  }' | tee workflows-names.json

                  echo "\n### Workflow Names JSON" >> $GITHUB_STEP_SUMMARY
                  echo '```json' >> $GITHUB_STEP_SUMMARY
                  cat workflows-names.json >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

    APICallCheckArtifacts:
        needs: Checkrepository
        runs-on: ubuntu-latest
        steps:
            - name: Make API Call to check for Artifacts in repository
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "Making API Call to check for Artifacts in repository..." >> $GITHUB_STEP_SUMMARY
                  response=$(gh api \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-Github-Api-Version: 2022-11-28" \
                    /repos/${{ env.OWNER }}/${{ env.REPO }}/actions/artifacts)

                  echo "$response" | jq '{
                    owner: "${{ env.OWNER }}",
                    repo: "${{ env.REPO }}",
                    total_count: (.total_count // 0),
                    artifact_names: [.artifacts[]?.name]
                  }' | tee artifact-names.json

                  echo "\n### Artifact Names JSON" >> $GITHUB_STEP_SUMMARY
                  echo '```json' >> $GITHUB_STEP_SUMMARY
                  cat artifact-names.json >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
