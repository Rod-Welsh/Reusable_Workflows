name: Reusable - Invicti DAST Scan

on:
    workflow_call:
        inputs:
            environment:
                description: "Deployment environment (e.g. dev, staging, production)"
                required: true
                type: string
            target-url:
                description: "URL of the deployed application to scan"
                required: false
                type: string
                default: "https://example.com"

jobs:
    invicti-scan_production:
        if: ${{ github.environment == 'production'}}
        name: Invicti Dynamic Application Security Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Invicti DAST scan
              run: |
                  echo "=== Invicti Dynamic Application Security Testing (DAST) ==="
                  echo "Environment : ${{ inputs.environment }}"
                  echo "Target URL  : ${{ inputs.target-url }}"
                  echo "Repository  : ${{ github.repository }}"
                  echo "Triggered by: ${{ github.actor }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Invicti platform..."
                  echo "[PLACEHOLDER] Initiating DAST scan against: ${{ inputs.target-url }}"
                  echo "[PLACEHOLDER] Crawling application endpoints..."
                  echo "[PLACEHOLDER] Running active security tests (XSS, SQLi, CSRF, etc.)..."
                  echo "[PLACEHOLDER] Scan complete. Critical: 0, High: 0, Medium: 1, Low: 3"
                  echo "[PLACEHOLDER] DAST scan result: PASSED"

            - name: Write job summary
              run: |
                  echo "## Invicti DAST Scan Results :globe_with_meridians:" >> $GITHUB_STEP_SUMMARY
                  echo "| Severity | Findings |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| Critical | 0 ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| High | 0 ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Medium | 1 |" >> $GITHUB_STEP_SUMMARY
                  echo "| Low | 3 |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Target:** ${{ inputs.target-url }} | **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY

    invicti-scan_non_production:
        if: ${{ github.environment != 'production'}}
        name: Invicti DAST Scan (Non-Production)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Invicti DAST scan
              run: |
                  echo "=== Invicti Dynamic Application Security Testing (DAST) ==="
                  echo "Environment : ${{ inputs.environment }}"
                  echo "Target URL  : ${{ inputs.target-url }}"
                  echo "Repository  : ${{ github.repository }}"
                  echo "Triggered by: ${{ github.actor }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Invicti platform..."
                  echo "[PLACEHOLDER] Initiating DAST scan against: ${{ inputs.target-url }}"
                  echo "[PLACEHOLDER] Crawling application endpoints..."
                  echo "[PLACEHOLDER] Running active security tests (XSS, SQLi, CSRF, etc.)..."
                  echo "[PLACEHOLDER] Scan complete. Critical: 0, High: 0, Medium: 2, Low: 5"
                  echo "[PLACEHOLDER] DAST scan result: PASSED"

            - name: Write job summary
              run: |
                  echo "## Invicti DAST Scan Results :globe_with_meridians:" >> $GITHUB_STEP_SUMMARY
                  echo "| Severity | Findings |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| Critical | 0 ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| High | 0 ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| Medium | 2 |" >> $GITHUB_STEP_SUMMARY
                  echo "| Low | 5 |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Target:** ${{ inputs.target-url }} | **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
