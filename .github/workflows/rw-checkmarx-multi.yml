name: Reusable - Checkmarx Multi-Mode Scan

on:
    workflow_call:
        inputs:
            environment:
                description: "Deployment environment (e.g. dev, staging, production)"
                required: true
                type: string
            run-sast-sca-api-scan:
                description: "Run SAST + SCA + API combined scan"
                required: false
                type: boolean
                default: false
            run-api-scan:
                description: "Run API security scan"
                required: false
                type: boolean
                default: false
            run-sbom-scan:
                description: "Run SBOM scan/analysis"
                required: false
                type: boolean
                default: false
            run-sbom-create:
                description: "Generate SBOM and upload artifacts"
                required: false
                type: boolean
                default: false
            project-name:
                description: "Checkmarx project name to scan under"
                required: false
                type: string
                default: "${{ github.repository }}"

jobs:
    sast-sca-api-scan:
        if: ${{ inputs.run-sast-sca-api-scan == true }}
        name: Checkmarx SAST + SCA + API Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Checkmarx SAST + SCA + API scan
              run: |
                  echo "=== Checkmarx SAST + SCA + API Scan ==="
                  echo "Environment  : ${{ inputs.environment }}"
                  echo "Project Name : ${{ inputs.project-name }}"
                  echo "Repository   : ${{ github.repository }}"
                  echo "Commit SHA   : ${{ github.sha }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Checkmarx One platform..."
                  echo "[PLACEHOLDER] Running SAST scan for project: ${{ inputs.project-name }}"
                  echo "[PLACEHOLDER] Running SCA (Software Composition Analysis)..."
                  echo "[PLACEHOLDER] Running API security scan..."
                  echo "[PLACEHOLDER] Scan complete. Critical: 0, High: 0, Medium: 2, Low: 5"
                  echo "[PLACEHOLDER] Result: PASSED (no critical/high vulnerabilities)"

            - name: Write job summary
              run: |
                  echo "## Checkmarx SAST + SCA + API Scan Results :shield:" >> $GITHUB_STEP_SUMMARY
                  echo "| Scan | Severity | Count |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| SAST | Critical | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "| SAST | High | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "| SCA | Critical | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "| API | Critical | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Result: ✅ PASSED** | **Environment:** ${{ inputs.environment }} | **Project:** ${{ inputs.project-name }}" >> $GITHUB_STEP_SUMMARY

    api-scan:
        if: ${{ inputs.run-api-scan == true }}
        name: Checkmarx API Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Checkmarx API scan
              run: |
                  echo "=== Checkmarx API Security Scan ==="
                  echo "Environment  : ${{ inputs.environment }}"
                  echo "Project Name : ${{ inputs.project-name }}"
                  echo "Repository   : ${{ github.repository }}"
                  echo "Commit SHA   : ${{ github.sha }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Checkmarx One platform..."
                  echo "[PLACEHOLDER] Discovering API endpoints for project: ${{ inputs.project-name }}"
                  echo "[PLACEHOLDER] Running API security scan..."
                  echo "[PLACEHOLDER] Scan complete. Critical: 0, High: 0, Medium: 1, Low: 3"
                  echo "[PLACEHOLDER] API scan result: PASSED"

            - name: Write job summary
              run: |
                  echo "## Checkmarx API Scan Results :shield:" >> $GITHUB_STEP_SUMMARY
                  echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| Critical | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "| High | 0 |" >> $GITHUB_STEP_SUMMARY
                  echo "| Medium | 1 |" >> $GITHUB_STEP_SUMMARY
                  echo "| Low | 3 |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Result: ✅ PASSED** | **Environment:** ${{ inputs.environment }} | **Project:** ${{ inputs.project-name }}" >> $GITHUB_STEP_SUMMARY

    sbom-scan:
        if: ${{ inputs.run-sbom-scan == true }}
        name: Checkmarx SBOM Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Checkmarx SBOM scan
              run: |
                  echo "=== Checkmarx SBOM Scan ==="
                  echo "Environment  : ${{ inputs.environment }}"
                  echo "Project Name : ${{ inputs.project-name }}"
                  echo "Repository   : ${{ github.repository }}"
                  echo "Commit SHA   : ${{ github.sha }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Checkmarx One platform..."
                  echo "[PLACEHOLDER] Scanning software bill of materials for: ${{ inputs.project-name }}"
                  echo "[PLACEHOLDER] Analysing component inventory and vulnerabilities..."
                  echo "[PLACEHOLDER] SBOM scan complete. Components: 0 vulnerable, all compliant"
                  echo "[PLACEHOLDER] SBOM scan result: PASSED"

            - name: Write job summary
              run: |
                  echo "## Checkmarx SBOM Scan Results :shield:" >> $GITHUB_STEP_SUMMARY
                  echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| Vulnerable Components | 0 ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| License Compliance | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Result: ✅ PASSED** | **Environment:** ${{ inputs.environment }} | **Project:** ${{ inputs.project-name }}" >> $GITHUB_STEP_SUMMARY

    sbom-create:
        if: ${{ inputs.run-sbom-create == true }}
        name: Checkmarx SBOM Create
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate Checkmarx SBOM
              run: |
                  echo "=== Checkmarx SBOM Creation ==="
                  echo "Environment  : ${{ inputs.environment }}"
                  echo "Project Name : ${{ inputs.project-name }}"
                  echo "Repository   : ${{ github.repository }}"
                  echo "Commit SHA   : ${{ github.sha }}"
                  echo ""
                  echo "[PLACEHOLDER] Authenticating with Checkmarx One platform..."
                  echo "[PLACEHOLDER] Generating SBOM for project: ${{ inputs.project-name }}"
                  echo "[PLACEHOLDER] Writing checkmarx-sbom_create.json..."
                  echo "[PLACEHOLDER] Writing checkmarx-sbom_create_sbom.json..."
                  echo "[PLACEHOLDER] SBOM generation complete"
                  # Create placeholder output files
                  echo '{"project":"${{ inputs.project-name }}","type":"scan-output","status":"placeholder"}' \
                      > checkmarx-sbom_create.json
                  echo '{"project":"${{ inputs.project-name }}","type":"sbom","status":"placeholder"}' \
                      > checkmarx-sbom_create_sbom.json

            - name: Upload Checkmarx scan output artifact
              uses: actions/upload-artifact@v4
              with:
                  name: checkmarx-sbom_create
                  path: checkmarx-sbom_create.json

            - name: Upload Checkmarx SBOM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: checkmarx-sbom_create_sbom
                  path: checkmarx-sbom_create_sbom.json

            - name: Write job summary
              run: |
                  echo "## Checkmarx SBOM Creation Results :package:" >> $GITHUB_STEP_SUMMARY
                  echo "| Artifact | File |" >> $GITHUB_STEP_SUMMARY
                  echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
                  echo "| Scan Output | checkmarx-sbom_create.json ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "| SBOM | checkmarx-sbom_create_sbom.json ✅ |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Result: ✅ CREATED** | **Environment:** ${{ inputs.environment }} | **Project:** ${{ inputs.project-name }}" >> $GITHUB_STEP_SUMMARY
